$schema: https://developer.microsoft.com/json-schemas/fabric/item/deploymentPlan/definition/plan/1.0.0/schema.json
version: 1.0.0
groups:
  - name: Scenario
    logicalId: 094b6f1f-2619-41ad-b7c8-79cc62f71bf1
  - name: SeedScenario
    logicalId: b51938f9-c50b-4e93-b769-7e03b02eda7b
    dependsOn:
      - groupName: Scenario
    postActions:
      - name: Seed demo data
        job:
          type: Execute
          logicalId: b51938f9-c50b-4e93-b769-7e03b02eda7b
          parameters:
            - name: lakehouse_name
              value: Scenario
            - name: allow_other_workspaces
              value: false
  - name: ScenarioOntology
    logicalId: e6a99499-e3f5-4a9b-8288-3985c73a05e5
    dependsOn:
      - groupName: SeedScenario
  - name: BindScenario
    logicalId: 52c47324-b4ec-4504-b6af-62fbf6ead50f
    dependsOn:
      - groupName: ScenarioOntology
    postActions:
      - name: Bind seeded ontology
        job:
          type: Execute
          logicalId: 52c47324-b4ec-4504-b6af-62fbf6ead50f
          parameters:
            - name: lakehouse_name
              value: Scenario
            - name: ontology_name
              value: ScenarioOntology
