<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2530" viewBox="0 0 2400 2530" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Private document review: target Azure architecture</title>
<desc id="diagram-description">Human-validated Form 3500 evidence flows from a private portal through separate original and published Blob containers, custom Content Understanding, two private Search indexers, case-and-owner-filtered Foundry IQ retrieval and a tools-disabled managed prompt agent. Native state and staged private ACR builds remain separate ownership boundaries. This is not a readiness or FIPS certification claim.</desc>
