#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - dnsmasq
write_files:
  - path: /etc/sysctl.d/90-poc-router.conf
    owner: root:root
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  - path: /etc/dnsmasq.d/90-tailnet.conf
    owner: root:root
    permissions: '0644'
    content: |
      interface=tailscale0
      except-interface=lo
      bind-dynamic
      no-resolv
      no-hosts
      server=168.63.129.16
      cache-size=0
  - path: /usr/local/sbin/provision-poc-connectivity
    owner: root:root
    permissions: '0700'
    content: |
      #!/bin/sh
      set -eu
      install -d -m 0755 /usr/share/keyrings
      curl --fail --silent --show-error --location \
        https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
        --output /usr/share/keyrings/tailscale-archive-keyring.gpg
      chmod 0644 /usr/share/keyrings/tailscale-archive-keyring.gpg
      printf '%s\n' \
        'deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main' \
        > /etc/apt/sources.list.d/tailscale.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends tailscale
      sysctl --system
      dnsmasq --test
      systemctl enable --now tailscaled
      systemctl restart dnsmasq
runcmd:
  - [/usr/local/sbin/provision-poc-connectivity]
